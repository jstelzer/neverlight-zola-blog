base_url = "https://moto-blog.neverlight.com"
generate_feeds = true
compile_sass = true
feed_filenames = ["atom.xml", "rss.xml"]

title = "Neverlight Moto Blog"
description = "Long-distance motorcycle touring, moto camping, and rally stories from the road."

theme = "neverlight-theme"
taxonomies = [
    {name = "categories", feed = true, paginate_by=5},
    {name = "tags", feed = true, paginate_by=5},
]

[extra]
author = "Mental"
clean_blog_menu = [
    {url = "$BASE_URL", name = "Home"},
    {url = "$BASE_URL/about", name = "About"},
    {url = "$BASE_URL/cats", name = "Cats"},
    {url = "$BASE_URL/contact", name = "Contact"},
    {url = "$BASE_URL/tags", name = "Tags"},
]
[markdown.highlighting]
theme = "catppuccin-mocha"
